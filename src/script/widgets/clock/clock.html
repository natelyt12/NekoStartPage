<div class="widget clock-widget" id="widget-clock" style="position: absolute; left: 10px; top: 10px; width: max-content; min-width: 250px; height: auto; z-index: 10;">
    <div class="clock-digital-container">
        <div class="clock-digital-row">
            <span class="clock-time" id="clock-widget-time">00:00</span>
            <div class="clock-sec-ampm">
                <span class="clock-ampm" id="clock-widget-ampm" style="display:none"></span>
                <span class="clock-seconds" id="clock-widget-seconds">:00</span>
            </div>
        </div>
        <div class="clock-date-group">
            <div class="clock-date" id="clock-widget-date">Wednesday, 1/1/2025</div>
            <div class="clock-lunar" id="clock-widget-lunar">Âm lịch: Đang tải...</div>
        </div>
    </div>
</div>
