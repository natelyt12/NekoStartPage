<div class="setting_section">
    <p class="setting_title" data-i18n="setting_panel.time.title">Thời gian</p>
    <div class="setting_options">
        <div id="time_output"></div>
        <label class="checkbox btn_liked">
            <span data-i18n="setting_panel.time.add_zero_hour">Hiển thị số 0 trong giờ</span>
            <input type="checkbox" id="add_zero_hour" />
            <div class="ts-track">
                <div class="ts-thumb"></div>
            </div>
        </label>
        <label class="checkbox btn_liked">
            <span data-i18n="setting_panel.time.show_seconds">Hiển thị giây</span>
            <input type="checkbox" id="show_seconds" />
            <div class="ts-track">
                <div class="ts-thumb"></div>
            </div>
        </label>
        <label class="checkbox btn_liked">
            <span data-i18n="setting_panel.time.clock_format_12h">Sử dụng định dạng 12h</span>
            <input type="checkbox" id="clock_format_12h" />
            <div class="ts-track">
                <div class="ts-thumb"></div>
            </div>
        </label>
        <label class="checkbox btn_liked">
            <span data-i18n="setting_panel.time.show_ampm">Hiển thị AM/PM</span>
            <input type="checkbox" id="show_ampm" />
            <div class="ts-track">
                <div class="ts-thumb"></div>
            </div>
        </label>
        <hr style="margin: 4px 0;" />
        <label class="checkbox btn_liked">
            <span data-i18n="setting_panel.time.clock_no_bg">Nền trong suốt</span>
            <input type="checkbox" id="clock_no_bg" />
            <div class="ts-track">
                <div class="ts-thumb"></div>
            </div>
        </label>
    </div>
</div>
