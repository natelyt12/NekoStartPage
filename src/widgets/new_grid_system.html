<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div Size</title>
    <style>
body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    box-sizing: border-box;
    overflow: hidden; /* Theo yêu cầu xóa overlay auto, để hidden */
}

.container {
    height: 100%;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
}

#my-div {
    background-color: #ffcccc;
    box-sizing: border-box;
    position: relative; /* Để widget có thể absolute theo div này */
    
    display: flex;
    align-items: center;
    justify-content: center;
}

#my-div::after {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    border: 1px solid black;
    pointer-events: none;
    z-index: 10;
}

.widget {
    border-radius: 8px;
    position: absolute;
    cursor: grab;
    z-index: 20;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    /* Màu nền, kích thước, color, left, top sẽ được gán inline */
}

.widget:active {
    cursor: grabbing;
    z-index: 30; /* Đưa widget đang kéo lên trên cùng */
}

.widget::after {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    border: 1px solid currentColor; /* Sử dụng 'color' của widget làm viền */
    border-radius: inherit;
    pointer-events: none;
}

/* Menu điểm neo */
#anchor-menu {
    position: fixed;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2px;
    background: white;
    border: 1px solid #ccc;
    padding: 4px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    z-index: 100;
    border-radius: 4px;
}

#anchor-menu.hidden {
    display: none;
}

#anchor-menu button {
    width: 32px;
    height: 32px;
    cursor: pointer;
    background: #f9f9f9;
    border: 1px solid #ddd;
    font-size: 10px;
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
}

#anchor-menu button:hover {
    background: #e0e0e0;
}

#size-text {
    color: white;
    font-weight: bold;
    font-family: monospace;
    font-size: 24px;
}

/* Các đường gợi ý (crosshairs) */
.guideline {
    position: absolute;
    background-color: rgba(0, 0, 0, 0.2); /* Màu đen trong suốt */
    pointer-events: none; /* Không cản trở các thao tác chuột */
    z-index: 10;
}

.guideline.vertical {
    top: 0;
    bottom: 0;
    left: 50%;
    width: 2px;
    transform: translateX(-50%);
}

.guideline.horizontal {
    left: 0;
    right: 0;
    top: 50%;
    height: 2px;
    transform: translateY(-50%);
}
    </style>
</head>
<body>
    <div class="container">
        <!-- Đường gợi ý chính giữa -->
        <div class="guideline vertical"></div>
        <div class="guideline horizontal"></div>
        
        <div id="my-div">
            <span id="size-text"></span>
            <!-- Nhiều widget với kích thước khác nhau -->
            <div class="widget" style="width: 60px; height: 60px; background-color: #4CAF50; color: #388E3C;"></div>
            <div class="widget" style="width: 100px; height: 50px; background-color: #2196F3; color: #1976D2;"></div>
            <div class="widget" style="width: 40px; height: 120px; background-color: #FF9800; color: #F57C00;"></div>
            <div class="widget" style="width: 80px; height: 80px; background-color: #9C27B0; color: #7B1FA2;"></div>
        </div>
    </div>

    <!-- Menu chọn điểm neo -->
    <div id="anchor-menu" class="hidden">
        <button data-ax="0" data-ay="0" title="Top Left">TL</button>
        <button data-ax="50" data-ay="0" title="Top Center">TC</button>
        <button data-ax="100" data-ay="0" title="Top Right">TR</button>
        <button data-ax="0" data-ay="50" title="Center Left">CL</button>
        <button data-ax="50" data-ay="50" title="Center Center">CC</button>
        <button data-ax="100" data-ay="50" title="Center Right">CR</button>
        <button data-ax="0" data-ay="100" title="Bottom Left">BL</button>
        <button data-ax="50" data-ay="100" title="Bottom Center">BC</button>
        <button data-ax="100" data-ay="100" title="Bottom Right">BR</button>
    </div>

    <script>
const myDiv = document.getElementById('my-div');
const sizeText = document.getElementById('size-text');

// Hàm nội suy tuyến tính
function lerp(start, end, factor) {
    return start + (end - start) * factor;
}

// Trạng thái hiện tại và đích
let currentWidth = 0;
let currentHeight = 0;
let targetWidth = 0;
let targetHeight = 0;

function calculateTargetSize() {
    // Làm tròn kích thước theo bội số của 10
    // (Vì điểm neo ở giữa, nên từ tâm ra mép sẽ luôn là bội số của 5)
    targetWidth = Math.trunc(window.innerWidth / 10) * 10;
    targetHeight = Math.trunc(window.innerHeight / 10) * 10;
}

// Khởi tạo kích thước ngay từ đầu để vẽ lên luôn
calculateTargetSize();
currentWidth = targetWidth;
currentHeight = targetHeight;

function animate() {
    currentWidth = lerp(currentWidth, targetWidth, 0.15);
    currentHeight = lerp(currentHeight, targetHeight, 0.15);

    myDiv.style.width = currentWidth + 'px';
    myDiv.style.height = currentHeight + 'px';

    sizeText.textContent = `${Math.round(currentWidth)}px x ${Math.round(currentHeight)}px`;

    requestAnimationFrame(animate);
}

window.addEventListener('resize', calculateTargetSize);
animate();

// Logic kéo thả nhiều widget (snap vào lưới 5px)
const widgets = document.querySelectorAll('.widget');

// Vị trí khởi tạo ngẫu nhiên nhưng vẫn khớp lưới 5px
const initialPositions = [
    { x: -80, y: -80 },
    { x: 80, y: -40 },
    { x: -60, y: 70 },
    { x: 50, y: 90 }
];

let activeWidget = null;
let isDragging = false;
let startMouseX = 0, startMouseY = 0;

widgets.forEach((w, index) => {
    // Thiết lập vị trí và điểm neo ban đầu
    const pos = initialPositions[index] || { x: 0, y: 0 };
    w.dataset.x = pos.x;
    w.dataset.y = pos.y;
    w.dataset.ax = 50; // Neo mặc định ở tâm (50%)
    w.dataset.ay = 50;
    
    // Đặt thuộc tính left/top cho widget dựa vào ax, ay
    w.style.left = `${w.dataset.ax}%`;
    w.style.top = `${w.dataset.ay}%`;
    w.style.transform = `translate(calc(-${w.dataset.ax}% + ${pos.x}px), calc(-${w.dataset.ay}% + ${pos.y}px))`;

    // Chuột phải để mở menu điểm neo
    w.addEventListener('contextmenu', (e) => {
        e.preventDefault(); // Ngăn menu mặc định của trình duyệt
        targetWidgetForAnchor = w;
        anchorMenu.style.left = e.clientX + 'px';
        anchorMenu.style.top = e.clientY + 'px';
        anchorMenu.classList.remove('hidden');
    });

    w.addEventListener('mousedown', (e) => {
        // Chỉ xử lý kéo thả khi bấm chuột trái (button 0)
        if (e.button !== 0) return;
        isDragging = true;
        activeWidget = w;
        startMouseX = e.clientX;
        startMouseY = e.clientY;
        activeWidget.dataset.initialX = activeWidget.dataset.x;
        activeWidget.dataset.initialY = activeWidget.dataset.y;
    });
});

window.addEventListener('mousemove', (e) => {
    if (!isDragging || !activeWidget) return;
    
    const dx = e.clientX - startMouseX;
    const dy = e.clientY - startMouseY;
    
    const initialX = parseFloat(activeWidget.dataset.initialX);
    const initialY = parseFloat(activeWidget.dataset.initialY);
    
    // Lấy điểm neo hiện tại của widget
    const ax = activeWidget.dataset.ax || 50;
    const ay = activeWidget.dataset.ay || 50;
    
    // Làm tròn khoảng cách kéo để snap vào lưới 5px
    const newX = Math.round((initialX + dx) / 5) * 5;
    const newY = Math.round((initialY + dy) / 5) * 5;
    
    activeWidget.dataset.x = newX;
    activeWidget.dataset.y = newY;
    
    // Cập nhật vị trí thông qua transform kèm điểm neo tương ứng
    activeWidget.style.transform = `translate(calc(-${ax}% + ${newX}px), calc(-${ay}% + ${newY}px))`;
});

window.addEventListener('mouseup', () => {
    isDragging = false;
    activeWidget = null;
});

// Logic Menu Điểm Neo
const anchorMenu = document.getElementById('anchor-menu');
let targetWidgetForAnchor = null;

// Ẩn menu khi click ra ngoài
document.addEventListener('click', (e) => {
    if (!e.target.closest('#anchor-menu')) {
        anchorMenu.classList.add('hidden');
        targetWidgetForAnchor = null;
    }
});

// Xử lý khi chọn điểm neo
anchorMenu.addEventListener('click', (e) => {
    if (e.target.tagName === 'BUTTON' && targetWidgetForAnchor) {
        const ax = e.target.dataset.ax;
        const ay = e.target.dataset.ay;
        
        targetWidgetForAnchor.dataset.ax = ax;
        targetWidgetForAnchor.dataset.ay = ay;
        
        // Cập nhật vị trí neo (left/top)
        targetWidgetForAnchor.style.left = `${ax}%`;
        targetWidgetForAnchor.style.top = `${ay}%`;
        
        // Reset vị trí offset về 0 (tp về đúng điểm neo mới)
        targetWidgetForAnchor.dataset.x = 0;
        targetWidgetForAnchor.dataset.y = 0;
        
        targetWidgetForAnchor.style.transform = `translate(calc(-${ax}% + 0px), calc(-${ay}% + 0px))`;
        
        anchorMenu.classList.add('hidden');
        targetWidgetForAnchor = null;
    }
});
    </script>
</body>
</html>
