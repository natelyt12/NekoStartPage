<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="tab_new">Tab mới</title>
    <link rel="stylesheet" href="style.css" />
    <!-- web icon -->
    <link rel="icon" href="./assets/icons/icon-16.png" />
</head>

<body>
    <div class="container">
        <div class="onload_animation_frame">
            <div class="wavy background_container">
                <div class="image"></div>
                <video class="video" loop muted></video>
            </div>
            <div class="wallpaper_effect_container"></div>
        </div>
        <!-- Static effects: outside onload_animation_frame, not affected by bg transforms -->
        <div class="static_effect_container"></div>
        <div class="overlay"></div>

        <div class="safemode">
            <p data-i18n="setting_panel.utils.presentation_mode_active">Chế độ thuyết trình đang bật</p>
        </div>

        <div id="widgets_container"></div>
    </div>

    <!-- Feature Templates -->
    <template id="tpl_wallpaper_editor">
        <div class="popup_body wallpaper_editor">
            <p style="margin: 0" data-i18n="bg_editor.window_subtitle">Kéo khung hình chữ nhật để chọn vùng hiển thị</p>
            <div id="editor_container" class="editor_container">
                <div id="full_image_view" class="full_image_view">
                    <div id="view_lens" class="view_lens">
                        <div class="lens_corner" data-corner="nw"></div>
                        <div class="lens_corner" data-corner="ne"></div>
                        <div class="lens_corner" data-corner="sw"></div>
                        <div class="lens_corner" data-corner="se"></div>
                    </div>
                </div>
            </div>
            <div class="editor_row" style="margin-bottom: 8px;">
                <label class="checkbox btn_liked"
                    style="width: 100%; justify-content: space-between; padding: 10px 14px;">
                    <span data-i18n="bg_editor.fit_mode_label">Hiển thị toàn bộ ảnh</span>
                    <div style="display: flex; align-items: center;">
                        <input type="checkbox" id="fit_mode_checkbox" />
                        <div class="ts-track">
                            <div class="ts-thumb"></div>
                        </div>
                    </div>
                </label>
            </div>
            <div class="editor_controls" id="manual_controls">
                <!-- Dynamic sliders injected here -->
            </div>
            <div class="actions">
                <button id="btn_reset" data-i18n="bg_editor.btn_reset">Đặt lại</button>
                <button id="btn_apply" data-i18n="bg_editor.btn_apply">Áp dụng</button>
            </div>
            <span class="tooltip" data-i18n="bg_editor.note_tooltip">Lưu ý: Zoom tại đây và Zoom trong
                Wavy Animation không liên quan đến nhau</span>
        </div>
    </template>

    <template id="tpl_wavy_settings">
        <div class="popup_body wavy_settings" style="width: 100%; max-width: 420px; box-sizing: border-box; gap: 14px;">
            <div id="wavy_sliders_container" style="display: flex; flex-direction: column; gap: 8px; width: 100%;">
                <!-- Dynamic sliders injected here -->
            </div>
            <hr />

            <div class="actions">
                <div>
                    <button id="btn_reset" class="secondary" data-i18n="wavy_editor.btn_default">Mặc định</button>
                    <button id="btn_preview" class="secondary" data-i18n="wavy_editor.btn_preview">Áp dụng</button>
                </div>
                <div>
                    <button id="btn_random" class="secondary" data-i18n="wavy_editor.btn_random">Ngẫu nhiên</button>
                    <button id="btn_save" class="primary" data-i18n="wavy_editor.btn_save">Lưu</button>
                </div>
            </div>
            <span class="tooltip" data-i18n="wavy_editor.note_tooltip">
                Tính năng mang lại trải nghiệm tốt nhất khi để ở giá trị mặc định. Việc tăng Tốc độ quá cao có thể gây
                cảm giác chóng mặt hoặc mỏi mắt. Nếu
                tăng Biên độ quá lớn, hình ảnh có thể làm lộ viền, bạn hãy tăng nhẹ độ Phóng to để khắc phục.
            </span>
        </div>
    </template>

    <template id="tpl_onload_settings">
        <div class="popup_body">
            <p class="popup_section_title" data-i18n="onload_animation.preset_label" style="margin-top: 0;">Hiệu ứng có
                sẵn</p>
            <div class="dropdown_wrapper">
                <button class="subsection_button" id="onload_preset">
                    <span class="selected_value">--</span>
                    <div class="sbsctsvg"></div>
                </button>
                <div class="subsection grid_2col">
                    <div class="dropdown_item btn_liked" data-value="default"
                        data-i18n="onload_animation.default_preset">Mặc định</div>
                    <div class="dropdown_item btn_liked" data-value="zoom_in_light"
                        data-i18n="onload_animation.zoom_in_light_preset">Nhẹ nhàng</div>
                    <div class="dropdown_item btn_liked" data-value="zoom_in_heavy"
                        data-i18n="onload_animation.zoom_in_heavy_preset">Điện ảnh</div>
                    <div class="dropdown_item btn_liked" data-value="sleepy"
                        data-i18n="onload_animation.wake_up_preset">Mơ ngủ</div>
                    <div class="dropdown_item btn_liked" data-value="nature" data-i18n="onload_animation.nature_preset">
                        Thiên nhiên</div>
                    <div class="dropdown_item btn_liked" data-value="custom" data-i18n="onload_animation.custom_preset">
                        Tùy chỉnh</div>
                </div>
            </div>
            <hr>
            <!-- Part 2: Background -->
            <p class="popup_section_title" data-i18n="onload_animation.custom_bg_label">Tùy chỉnh hình nền</p>
            <div class="dropdown_wrapper" style="gap: 6px; display: flex; flex-direction: column;">
                <span class="slider_label" data-i18n="onload_animation.bg_easing_label">Gia tốc nền</span>
                <button class="subsection_button" id="onload_bg_easing">
                    <span class="selected_value">--</span>
                    <div class="sbsctsvg"></div>
                </button>
                <div class="subsection grid_2col">
                    <div class="dropdown_item btn_liked" data-value="var(--ease_out)">Ease Out</div>
                    <div class="dropdown_item btn_liked" data-value="var(--ease_in_out)">Ease In-Out</div>
                    <div class="dropdown_item btn_liked" data-value="var(--expo_out)">Expo Out</div>
                    <div class="dropdown_item btn_liked" data-value="var(--expo_in_out)">Expo In-Out</div>
                    <div class="dropdown_item btn_liked" data-value="var(--cubic_out)">Cubic Out</div>
                    <div class="dropdown_item btn_liked" data-value="var(--cubic_in_out)">Cubic In-Out</div>
                    <div class="dropdown_item btn_liked" data-value="var(--sine_out)">Sine Out</div>
                    <div class="dropdown_item btn_liked" data-value="var(--sine_in_out)">Sine In-Out</div>
                    <div class="dropdown_item btn_liked" data-value="var(--linear)">Linear</div>
                </div>
            </div>
            <div class="custom_onload_animation" id="onload_bg_sliders"></div>
            <hr />
            <!-- Part 3: Overlay -->
            <p class="popup_section_title" data-i18n="onload_animation.custom_overlay_label">Tùy chỉnh lớp phủ</p>
            <div class="dropdown_wrapper" style="gap: 6px; display: flex; flex-direction: column;">
                <span class="slider_label" data-i18n="onload_animation.overlay_easing_label">Gia tốc lớp phủ</span>
                <button class="subsection_button" id="onload_overlay_easing">
                    <span class="selected_value">--</span>
                    <div class="sbsctsvg"></div>
                </button>
                <div class="subsection grid_2col">
                    <div class="dropdown_item btn_liked" data-value="var(--ease_out)">Ease Out</div>
                    <div class="dropdown_item btn_liked" data-value="var(--ease_in_out)">Ease In-Out</div>
                    <div class="dropdown_item btn_liked" data-value="var(--expo_out)">Expo Out</div>
                    <div class="dropdown_item btn_liked" data-value="var(--expo_in_out)">Expo In-Out</div>
                    <div class="dropdown_item btn_liked" data-value="var(--cubic_out)">Cubic Out</div>
                    <div class="dropdown_item btn_liked" data-value="var(--cubic_in_out)">Cubic In-Out</div>
                    <div class="dropdown_item btn_liked" data-value="var(--sine_out)">Sine Out</div>
                    <div class="dropdown_item btn_liked" data-value="var(--sine_in_out)">Sine In-Out</div>
                    <div class="dropdown_item btn_liked" data-value="var(--linear)">Linear</div>
                </div>
            </div>
            <div class="custom_onload_animation" id="onload_overlay_sliders"></div>
            <hr />
            <!-- Part 4: Others -->
            <p class="popup_section_title" data-i18n="onload_animation.other_settings_label">Cài đặt khác</p>
            <label class="checkbox btn_liked">
                <span data-i18n="onload_animation.widget_immediate">Giao diện xuất hiện ngay lập tức</span>
                <input type="checkbox" id="widget_immediate" />
                <div class="ts-track">
                    <div class="ts-thumb"></div>
                </div>
            </label>
            <span class="tooltip" data-i18n="onload_animation.widget_immediate_tooltip">Nếu tắt, giao diện sẽ đợi hoạt
                ảnh mở trang chạy xong mới hiển thị.</span>
            <hr />
            <div class="actions">
                <button id="btn_random" class="secondary" data-i18n="wavy_editor.btn_random">Ngẫu nhiên</button>
                <button id="btn_preview" class="secondary" data-i18n="onload_animation.btn_preview">Xem trước</button>
                <button id="btn_save" class="primary" data-i18n="onload_animation.btn_save">Lưu</button>
            </div>
        </div>
        </div>
    </template>

    <!-- tpl_particles_settings removed: editor is now built dynamically in JS -->

    <template id="tpl_filter_settings">
        <div class="popup_body" style="width: 100%; max-width: 420px; box-sizing: border-box; gap: 14px;">
            <div id="filter_sliders_container" style="display: flex; flex-direction: column; gap: 12px; width: 100%;">
                <!-- Dynamic sliders injected here -->
            </div>
            <hr />
            <div class="actions">
                <button id="btn_filter_reset" class="secondary" data-i18n="bg_editor.btn_reset">Đặt lại</button>
                <button id="btn_filter_save" class="primary" data-i18n="wavy_editor.btn_save">Lưu</button>
            </div>
        </div>
    </template>

    <!-- Settings Toggle Button -->
    <button type="button" id="setting_toggle_btn" class="btn_liked">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
                d="M12 15.5C13.933 15.5 15.5 13.933 15.5 12C15.5 10.067 13.933 8.5 12 8.5C10.067 8.5 8.5 10.067 8.5 12C8.5 13.933 10.067 15.5 12 15.5Z"
                stroke="white" stroke-width="2" />
            <path
                d="M19.43 12.98C19.47 12.66 19.5 12.33 19.5 12C19.5 11.67 19.47 11.34 19.43 11.02L21.54 9.37C21.73 9.22 21.78 8.95 21.66 8.73L19.66 5.27C19.54 5.05 19.28 4.97 19.06 5.06L16.56 6.06C16.04 5.65 15.47 5.31 14.85 5.06L14.5 2.39C14.47 2.17 14.28 2 14.05 2H9.95C9.72 2 9.53 2.17 9.5 2.39L9.15 5.06C8.53 5.31 7.96 5.65 7.44 6.06L4.94 5.06C4.72 4.97 4.46 5.05 4.34 5.27L2.34 8.73C2.22 8.95 2.27 9.22 2.46 9.37L4.57 11.02C4.53 11.34 4.5 11.67 4.5 12C4.5 12.33 4.53 12.66 4.57 12.98L2.46 14.63C2.27 14.78 2.22 15.05 2.34 15.27L4.34 18.73C4.46 18.95 4.72 19.03 4.94 18.94L7.44 17.94C7.96 18.35 8.53 18.69 9.15 18.94L9.5 21.61C9.53 21.83 9.72 22 9.95 22H14.05C14.28 22 14.47 21.83 14.5 21.61L14.85 18.94C15.47 18.69 16.04 18.35 16.56 17.94L19.06 18.94C19.28 19.03 19.54 18.95 19.66 18.73L21.66 15.27C21.78 15.05 21.73 14.78 21.54 14.63L19.43 12.98Z"
                stroke="white" stroke-width="2" />
        </svg>
    </button>

    <!-- Settings -->
    <div id="setting_wrapper" class="preload"></div>
</body>
<!-- Script -->
<script type="module" src="main.js"></script>

</html>
